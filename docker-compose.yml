services:
  postgres:
    image: postgres:17-alpine
    container_name: tuition-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tuition}
      POSTGRES_USER: ${DB_USERNAME:-tuition}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      # Host port 5433 by default (5432 is often taken on dev machines).
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
